<script>
    function switchPage(index, btn) {
        const list = document.getElementById('icon-list');
        const caret = document.getElementById('caret');
        
        list.className = 'icon-list animating-out';
        
        const offset = (index * 75) - 75; 
        caret.style.transform = `translateX(${offset}px)`;

        document.querySelectorAll('.page-link').forEach(l => l.classList.remove('active'));
        btn.classList.add('active');

        setTimeout(() => {
            list.className = 'icon-list';
            void list.offsetWidth; 
            list.className = 'icon-list animating-in';
        }, 800); // set to ig change the thing I DONT KNOW BRO THE TIEME OUT
    }
</script>
